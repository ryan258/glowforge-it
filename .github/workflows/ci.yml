name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is not redundant: its filesystem folds case, which is exactly
        # what the destination-collision guard has to get right.
        os: [ubuntu-latest, macos-latest]
        # numpy 2.4.x requires Python >= 3.11. Keep in sync with the
        # requires-python header in main.py (test_dependency_pins_match_script
        # enforces the dependency pins).
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Smoke-test the installed console scripts
        run: |
          gf --version
          glowforge-it --version

      - name: Run tests
        run: PYTHONPATH=. pytest tests/

  distribution:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build frontend
        run: python -m pip install build
      - name: Check wheel and sdist outside the checkout
        run: python scripts/check_distribution.py
