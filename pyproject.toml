[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glowforge-it"
version = "0.2.0rc1"
description = "Prepare raster artwork for Glowforge laser engraving"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ryan Johnson" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=2.4.2",
    "pillow>=12.1.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.2",
]

[project.scripts]
glowforge-it = "glowforge_it.cli:main"
gf = "glowforge_it.cli:gf_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["glowforge_it*"]
